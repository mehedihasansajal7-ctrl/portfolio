<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:400 800;font-display:swap;src:url(assets/inter.woff2) format('woff2')}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:'Inter',Arial,sans-serif;
    background:#F8FAFC;
    position:relative;
    display:flex;
    align-items:center;
    gap:48px;
    padding:64px 72px;
  }
  /* decorative */
  .blob1{position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(79,70,229,.16);filter:blur(90px);top:-190px;left:-140px}
  .blob2{position:absolute;width:460px;height:460px;border-radius:50%;background:rgba(14,165,164,.18);filter:blur(90px);bottom:-200px;right:120px}
  .bar{position:absolute;left:0;top:0;width:14px;height:100%;background:linear-gradient(180deg,#4F46E5,#0EA5A4)}

  .text{position:relative;flex:1;min-width:0;z-index:2}
  .eyebrow{display:inline-block;font-size:19px;font-weight:700;letter-spacing:.02em;color:#4F46E5;
           background:rgba(79,70,229,.10);border:1px solid rgba(79,70,229,.18);border-radius:999px;padding:8px 18px;margin-bottom:26px}
  h1{font-size:64px;line-height:1.04;letter-spacing:-.035em;color:#0F172A;font-weight:800}
  h1 span{color:#4F46E5}
  .role{font-size:27px;line-height:1.3;color:#334155;font-weight:600;margin-top:16px;max-width:660px}
  .rule{width:96px;height:6px;border-radius:4px;background:linear-gradient(90deg,#4F46E5,#0EA5A4);margin:26px 0 22px}
  .stats{display:flex;gap:34px}
  .stat b{display:block;font-size:30px;font-weight:800;color:#0F172A;letter-spacing:-.02em}
  .stat span{font-size:15px;color:#64748B;font-weight:500}
  .url{margin-top:26px;font-size:17px;color:#64748B;font-weight:600}
  .url b{color:#4F46E5}

  .photo-wrap{position:relative;flex:0 0 auto;z-index:2}
  .photo-wrap:before{content:"";position:absolute;inset:-14px;border-radius:34px;
                     background:linear-gradient(135deg,rgba(79,70,229,.30),rgba(14,165,164,.30));filter:blur(22px)}
  img{position:relative;display:block;width:340px;height:452px;object-fit:cover;object-position:center 12%;
      border-radius:26px;border:5px solid #fff;box-shadow:0 18px 40px rgba(15,23,42,.22)}
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="blob1"></div>
  <div class="blob2"></div>

  <div class="text">
    <span class="eyebrow">PORTFOLIO</span>
    <h1>Mehedi Hasan <span>Sajal</span></h1>
    <p class="role">Senior Officer — Sales Operation (MIS) · I build real business systems with AI</p>
    <div class="rule"></div>
    <div class="stats">
      <div class="stat"><b>5+</b><span>years in sales ops</span></div>
      <div class="stat"><b>7</b><span>systems shipped</span></div>
      <div class="stat"><b>20+</b><span>orders / day</span></div>
    </div>
    <p class="url"><b>mehedihasansajal7-ctrl.github.io/portfolio</b></p>
  </div>

  <div class="photo-wrap">
    <img src="mehedi-hasan-sajal.jpeg" alt="">
  </div>
</body>
</html>
